# book.yml — 理解分子模拟（中文版）在线站点配置
# 运行: minerupress-fetch book.yml    （上传 PDF 到 MinerU 云端 API，再导出）
# 运行: minerupress-export book.yml   （使用本地 MinerU 输出）

mineru_root: resources/mineru
docs_out: docs
volume_uid: molsim-cn

# 目录页过滤阈值
toc_max_page: 10

# 严格模式：先允许缺失，后续再收紧
allow_missing_boundaries: true

# MinerU 云端 API
api:
  token: ""                        # 从 .env 读取 MINERU_API_TOKEN
  enable_formula: true
  enable_table: true
  model_version: vlm
  sources:
    molsim-cn: "/home/yangkai/1-AI-CCUS/8-AI-CCUS/molsim2026/Chinese-Understanding Molecular Simulation/main_cn.pdf"

# 启用的插件
plugins:
  - qr_filter
  - cjk_spacing

# 章节列表
chapters:
  # 前言
  - slug: preface-berend
    title: 译者序

  - slug: preface1
    title: 第一版前言

  - slug: preface2
    title: 第二版前言

  - slug: preface3
    title: 第三版前言

  # 正文 16 章
